<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline - Murajaah Harian</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#fdfbf7;color:#0f172a}
  .box{text-align:center;padding:40px}
  .icon{font-size:64px}
  h1{font-size:24px;margin:16px 0 8px}
  p{color:#64748b;font-size:15px;line-height:1.6}
  button{margin-top:20px;background:#065f46;color:#fff;border:0;padding:12px 24px;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer}
</style>
</head>
<body>
  <div class="box">
    <div class="icon">📡</div>
    <h1>Kamu sedang offline</h1>
    <p>Periksa koneksi internetmu, lalu coba lagi.<br>Setoran murajaah hanya bisa dikirim saat online.</p>
    <button onclick="location.reload()">Coba Lagi</button>
  </div>
</body>
</html>
